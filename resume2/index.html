function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || '#home');
  useEffect(() => {
    const onChange = () => {
      setHash(window.location.hash || '#home');
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return hash;
}

function parseRoute(hash) {
  const cleaned = hash.replace(/^#\/?/, '') || 'home';
  const [page, ...rest] = cleaned.split('/');
  return { page, params: rest };
}

          <div className="page-meta-num">{PROJECTS.length}</div>
          <div className="page-meta-text">Projects Shipped</div>
          <div className="page-meta-text" style={{color: 'var(--ink3)'}}>2022 — 2025</div>
        </div>
      </div>

      <div className="category-grid">
        <a href="#work/team" className="category-card">
          <div className="cat-count-bg">{TEAM_PROJECTS.length}</div>
          <div className="cat-inner">
            <div className="cat-num">— Category 01</div>
            <h2 className="cat-title">TEAM<br/>PROJECTS</h2>
            <p className="cat-desc">
              Team projects built together with my teammates at DigiPen.
            </p>
            <div className="cat-foot">
              <div className="cat-foot-meta">{TEAM_PROJECTS.length} Projects · Enter</div>
              <div className="cat-arrow">→</div>
            </div>
          </div>
        </a>

        <a href="#work/solo" className="category-card">
          <div className="cat-count-bg">{SOLO_PROJECTS.length}</div>
          <div className="cat-inner">
            <div className="cat-num">— Category 02</div>
            <h2 className="cat-title">SOLO<br/>PROJECTS</h2>
            <p className="cat-desc">
              Personal builds shipped end-to-end. Full-stack, AI-assisted iteration, and small experiments that escaped the lab.
            </p>
            <div className="cat-foot">
              <div className="cat-foot-meta">{SOLO_PROJECTS.length} Project · Enter</div>
              <div className="cat-arrow">→</div>
            </div>
          </div>
        </a>
      </div>
    </main>
  );
}

/* =====================================================
   WORK LIST — filtered (team or solo)
   ===================================================== */

function WorkList({ category }) {
  const list = category === 'team' ? TEAM_PROJECTS : SOLO_PROJECTS;
  const title = category === 'team' ? 'Team Projects' : 'Solo Projects';
  return (
    <main className="view work-list" data-screen-label={title}>
      <a href="#work" className="work-back"><Icon.back /> Back to Categories</a>
      <div className="page-header">
        <h1 className="page-title">{title.split(' ')[0]}<br/>{title.split(' ')[1]}.</h1>
        <div className="page-meta">
          <div className="page-meta-num">{list.length}</div>
          <div className="page-meta-text">{category === 'team' ? 'Team-led builds' : 'Solo builds'}</div>
        </div>
      </div>
      <div className="work-grid">
        {list.map((p, i) => (
          <a key={p.id} href={`#project/${p.id}`} className="work-card">
            <div className="work-card-media">
              <div className={`work-card-badge ${p.type === 'team' ? 'team' : ''}`}>
                {p.type === 'team' ? `Team · ${p.team}` : 'Solo'}
              </div>
              <image-slot id={`card-${p.id}`} src={SLOT_SRC[`card-${p.id}`]} shape="rect" placeholder={`${p.name} cover`}></image-slot>
            </div>
            <div className="work-card-body">
              <div className="work-card-top">
                <div className="work-card-name">{p.name}</div>
                <div className="work-card-year">{p.year}</div>
              </div>
              <div className="work-card-desc">{p.blurb}</div>
              <div className="work-card-foot">
                <div className="work-card-tags">
                  {p.tech.slice(0, 3).map(t => <span key={t} className="work-card-tag">{t}</span>)}
                </div>
                <div className="work-card-arrow">→</div>
              </div>
            </div>
          </a>
        ))}
      </div>
    </main>
  );
}

/* =====================================================
   PROJECT DETAIL
   ===================================================== */

function ProjectDetail({ id }) {
  const project = PROJECTS.find(p => p.id === id);
  if (!project) {
    return (
      <main className="view project">
        <a href="#work" className="back-link"><Icon.back /> Back to Work</a>
        <h1 className="project-title">Not found.</h1>
      </main>
    );
  }
  const sameCategory = PROJECTS.filter(p => p.type === project.type);
  const idx = sameCategory.findIndex(p => p.id === id);
  const next = sameCategory[(idx + 1) % sameCategory.length];
  const backHash = project.type === 'team' ? '#work/team' : '#work/solo';
  return (
    <main className="view project" data-screen-label={`Project: ${project.name}`}>
      <a href={backHash} className="back-link"><Icon.back /> Back to {project.type === 'team' ? 'Team Projects' : 'Solo Projects'}</a>

      <div className="project-header">
        <div>
          <div className="project-subtitle">{project.subtitle}</div>
          <h1 className="project-title">{project.name}</h1>
        </div>
        <div className="project-meta">
          <div className="project-meta-cell">
            <div className="label">Role</div>
            <div className="value">{project.role}</div>
          </div>
          <div className="project-meta-cell">
            <div className="label">Team</div>
            <div className="value">{project.team}</div>
          </div>
          <div className="project-meta-cell">
            <div className="label">Year</div>
            <div className="value">{project.year}</div>
          </div>
          <div className="project-meta-cell">
            <div className="label">Stack</div>
            <div className="value" style={{fontFamily: 'var(--ff-mono)', fontSize: 14, lineHeight: 1.4}}>{project.tech.join(' · ')}</div>
          </div>
        </div>
      </div>

      {!project.games && (
      <div className="project-hero-media">
        <image-slot id={`hero-${project.id}`} src={SLOT_SRC[`hero-${project.id}`]} shape="rect" placeholder={`Hero image — ${project.name}`}></image-slot>
      </div>
      )}

      {project.intro && (
      <div className="project-body">
        <div className="project-section-label">— Introduction</div>
        <div className="project-section-content">{project.intro}</div>
      </div>
      )}

      <div className="project-body">
        <div className="project-section-label">— Overview</div>
        <div className="project-section-content">{project.overview}</div>
      </div>

      {project.games && (
        <div className="games-block">
          <div className="project-section-label">— The Games</div>
          <div className="games-list">
            {project.games.map((g) => (
              <div key={g.no} className="game-row">
                <div className="game-no">{g.no}</div>
                <div className="game-main">
                  <div className="game-name">{g.name}</div>
                  <div className="game-tag">{g.tag}</div>
                  <div className="game-desc">{g.desc}</div>
                </div>
                <div className="game-media">
                  <image-slot id={`game-${project.id}-${g.no}-a`} src={SLOT_SRC[`game-${project.id}-${g.no}-a`]} shape="rect" placeholder={`${g.name} — screenshot 1`}></image-slot>
                  <image-slot id={`game-${project.id}-${g.no}-b`} src={SLOT_SRC[`game-${project.id}-${g.no}-b`]} shape="rect" placeholder={`${g.name} — screenshot 2`}></image-slot>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="project-body">
        <div className="project-section-label">— My Role</div>
        <div className="project-section-content">
          {project.roleGroups ? (
            project.roleGroups.map((g, gi) => (
              <div key={gi} className="role-group">
                <div className="role-group-label">{g.label}</div>
                <ul>
                  {g.items.map((c, i) => <li key={i}>{c}</li>)}
                </ul>
              </div>
            ))
          ) : (
            <ul>
              {project.contributions.map((c, i) => <li key={i}>{c}</li>)}
            </ul>
          )}
        </div>
      </div>

      {!project.games && project.video !== false && (
      <div style={{marginBottom: 32}}>
        <div className="gallery-label">— Gameplay / Demo Video</div>
        <div className="video-slot">
          {project.video ? (
            project.video.includes('youtube') || project.video.includes('youtu.be')
              ? <iframe src={project.video} allow="autoplay; encrypted-media" allowFullScreen></iframe>
              : /\.(mp4|webm|ogg|mov)$/i.test(project.video)
                ? <video src={project.video} controls></video>
                : <iframe src={project.video} loading="lazy" title={`${project.name} live demo`}></iframe>
          ) : (
            <div className="video-placeholder">
              <div className="play-icon"></div>
              <div className="video-label">Drop a Video — set <code style={{background:'rgba(255,255,255,0.12)',padding:'4px 8px',fontSize:13}}>video</code> in PROJECTS</div>
            </div>
          )}
        </div>
      </div>
      )}

      {!project.games && (
      <div>
        <div className="gallery-label">— Screenshots / Gallery</div>
        <div className="gallery-grid">
          {project.gallery.map((g, i) => (
            <div key={i} className="gallery-slot">
              <image-slot id={`gallery-${project.id}-${i}`} src={SLOT_SRC[`gallery-${project.id}-${i}`]} shape="rect" placeholder={`Screenshot ${i + 1}`}></image-slot>
            </div>
          ))}
        </div>
      </div>
      )}

      {next && next.id !== project.id && (
        <a href={`#project/${next.id}`} className="next-project">
          <div>
            <div className="next-label">Next Project — {project.type === 'team' ? 'Team' : 'Solo'}</div>
            <div className="next-project-name">{next.name}</div>
          </div>
          <div className="next-arrow">→</div>
        </a>
      )}
    </main>
  );
}

/* =====================================================
   ABOUT
   ===================================================== */

function About() {
  return (
    <main className="view about" data-screen-label="About">
      <div className="page-header">
        <h1 className="page-title">About.</h1>
        <div className="page-meta">
          <div className="page-meta-num">02</div>
          <div className="page-meta-text">The Maker</div>
        </div>
      </div>

      <div className="about-grid">
        <h2 className="bio-large">
          Gameplay programmer
        </h2>
        <div className="bio-body">
          {PROFILE.longBio.map((p, i) => <p key={i}>{p}</p>)}
          <div className="resume-btn-wrap">
            <a href={PROFILE.resume} target="_blank" rel="noreferrer" className="btn-primary">
              <Icon.download /> Download Resume
            </a>
          </div>
        </div>
        <div className="about-portrait-wrap">
          <div className="about-portrait-deco" />
          <div className="about-portrait-slot">
            <image-slot id="home-portrait" src="img/portrait.jpg" shape="rect" placeholder="Drop your portrait"></image-slot>
          </div>
        </div>
      </div>

      <section className="about-section">
        <div>
          <div className="about-section-num">— 01</div>
          <h3 className="about-section-title">EDUCATION</h3>
        </div>
        <div>
          <div className="edu-entry">
            <div>
              <div className="edu-school">Keimyung University</div>
              <div className="edu-detail"><strong>B.S. in Computer Science</strong> · Daegu, South Korea</div>
              <div className="edu-detail">Dual-degree program with DigiPen Institute of Technology</div>
            </div>
            <div className="edu-date">2022 — Spring 2026</div>
          </div>
          <div className="edu-entry">
            <div>
              <div className="edu-school">DigiPen Institute of Technology</div>
              <div className="edu-detail"><strong>B.S. in Computer Science, Real-Time Interactive Simulation (RTIS)</strong> · Redmond, Washington</div>
              <div className="edu-detail">Dual-degree program with Keimyung University</div>
              <div className="edu-courses">Relevant Courses: Computer Graphics · Advanced C/C++ · Game Projects · Data Structures</div>
            </div>
            <div className="edu-date">2026 — 2028</div>
          </div>
        </div>
      </section>

      <section className="about-section">
        <div>
          <div className="about-section-num">— 02</div>
          <h3 className="about-section-title">SKILLS</h3>
        </div>
        <div className="skill-cluster">
          {SKILLS.map(group => (
            <div key={group.label} className="skill-row">
              <div className="skill-row-label">{group.label}</div>
              <div className="skill-tags">
                {group.items.map(s => <span key={s} className="skill-tag">{s}</span>)}
              </div>
            </div>
          ))}
        </div>
      </section>

      <section className="about-section">
        <div>
          <div className="about-section-num">— 03</div>
          <h3 className="about-section-title">LEADERSHIP</h3>
        </div>
        <div>
          {LEADERSHIP.map(l => (
            <div key={l.name} className="lead-entry">
              <div>
                <div className="lead-name">{l.name}</div>
                <div className="lead-desc">{l.desc}</div>
                <span className="lead-location">{l.location}</span>
              </div>
              <div className="lead-right">
                <div className="lead-role">{l.role}</div>
                <div className="lead-date">{l.date}</div>
              </div>
            </div>
          ))}
        </div>
      </section>
    </main>
  );
}

/* =====================================================
   CONTACT
   ===================================================== */

function Contact() {
  const cards = [
    { num: '01', label: 'Email', value: <span className="email-split">{PROFILE.email.split('@')[0]}<br/>@{PROFILE.email.split('@')[1]}</span>, cta: 'Send a message', href: `mailto:${PROFILE.email}`, icon: <Icon.mail />, target: null },
    { num: '02', label: 'GitHub', value: 'yanghyunw00', cta: 'View repositories', href: PROFILE.github, icon: <Icon.github />, target: '_blank' },
    { num: '03', label: 'LinkedIn', value: 'hyunw00', cta: 'Connect with me', href: PROFILE.linkedin, icon: <Icon.linkedin />, target: '_blank' },
    { num: '04', label: 'Resume', value: 'Download PDF', cta: 'Latest version', href: PROFILE.resume, icon: <Icon.download />, target: '_blank' },
  ];
  return (
    <main className="view contact" data-screen-label="Contact">
      <section className="contact-hero">
        <h1 className="contact-title">
          <span className="out">CON</span>TACT.
        </h1>
      </section>
      <section className="contact-grid">
        {cards.map((c) => (
          <a
            key={c.num}
            className="contact-card"
            href={c.href}
            {...(c.target ? { target: c.target, rel: 'noreferrer' } : {})}
          >
            <div className="contact-card-head">
              <span className="contact-card-num">{c.num}</span>
              <div className="contact-card-icon">{c.icon}</div>
            </div>
            <div className="contact-card-body">
              <div className="contact-card-label">{c.label}</div>
              <div className="contact-card-value">{c.value}</div>
            </div>
            <div className="contact-card-foot">
              <span className="contact-card-cta">{c.cta}</span>
              <span className="contact-card-arrow">↗</span>
            </div>
          </a>
        ))}
      </section>
    </main>
  );
}

/* =====================================================
   APP
   ===================================================== */

function App() {
  const hash = useHashRoute();
  const route = parseRoute(hash);
  let view;
  switch (route.page) {
    case 'home':
      view = <Home />; break;
    case 'work':
      if (route.params[0] === 'team' || route.params[0] === 'solo') {
        view = <WorkList category={route.params[0]} />;
      } else {
        view = <Work />;
      }
      break;
    case 'project':
      view = <ProjectDetail id={route.params[0]} />; break;
    case 'about':
      view = <About />; break;
    case 'contact':
      view = <Contact />; break;
    default:
      view = <Home />;
  }
  return (
    <>
      <Nav currentPage={route.page} />
      {view}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
