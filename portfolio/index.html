<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyunwoo Yang — portfolio</title>
<meta name="description" content="Hyunwoo Yang, software engineer in Redmond, WA. Building fun and reliable software, from games to real-world products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  color-scheme: light;
  --paper:#FFFFFF;
  --chrome:#F5F6F8;
  --chrome-2:#ECEEF1;
  --rule:#E2E5E9;
  --ink:#1D2228;
  --ink-2:#4A525C;
  --dim:#626B76;
  --line-hi:#F2F6FC;
  --sel:#D6E6FF;
  --blue:#0A5FDB;         /* status bar, focus, functions */
  --kw:#A1309E;           /* keyword */
  --str:#286D2B;          /* string */
  --num:#A74708;          /* number / metric */
  --type:#096E77;         /* type */
  --cmt:#626B76;          /* comment */
  --mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sans:'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --side:284px;
  --panel:230px;
  --gutter:64px;
  --gut:#B5BBC3;
  --hash:#C3C8CF;
  --mm:#D8DCE1;
  --mm-h:#9AA3AD;
  --mm-code:#C9B6E0;
  --mark:#FFE9A8;
  --err:#C2352B;
  --bar:var(--blue);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#1E1F22;
  --chrome:#18191B;
  --chrome-2:#2B2D31;
  --rule:#2E3035;
  --ink:#DCDFE4;
  --ink-2:#B4B9C1;
  --dim:#A0A7B1;
  --line-hi:#26282C;
  --sel:#23395B;
  --blue:#3B8EEA;
  --kw:#D58BD2;
  --str:#9CCB8A;
  --num:#E8A266;
  --type:#4FC1C9;
  --cmt:#A0A7B1;
  --gut:#565B63;
  --hash:#4A4F57;
  --mm:#3A3D43;
  --mm-h:#6B717A;
  --mm-code:#5C4A6E;
  --mark:#5A4A1C;
  --err:#F07068;
  --bar:#1F4F94;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#1E1F22;
  --chrome:#18191B;
  --chrome-2:#2B2D31;
  --rule:#2E3035;
  --ink:#DCDFE4;
  --ink-2:#B4B9C1;
  --dim:#A0A7B1;
  --line-hi:#26282C;
  --sel:#23395B;
  --blue:#3B8EEA;
  --kw:#D58BD2;
  --str:#9CCB8A;
  --num:#E8A266;
  --type:#4FC1C9;
  --cmt:#A0A7B1;
  --gut:#565B63;
  --hash:#4A4F57;
  --mm:#3A3D43;
  --mm-h:#6B717A;
  --mm-code:#5C4A6E;
  --mark:#5A4A1C;
  --err:#F07068;
  --bar:#1F4F94;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
::selection{background:var(--sel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ───────── app frame ───────── */
.app{
  height:100dvh;display:grid;
  grid-template-rows:36px minmax(0,1fr) 24px;
  grid-template-columns:48px var(--side) minmax(0,1fr);
  grid-template-areas:"title title title" "act side main" "status status status";
}
.app.no-side{grid-template-columns:48px 0 minmax(0,1fr)}
.app.no-side .side{visibility:hidden}

.title{
  grid-area:title;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:var(--chrome);border-bottom:1px solid var(--rule);
  font:500 12.5px/1 var(--mono);color:var(--ink-2);
}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.title .name{flex:1;text-align:center;letter-spacing:.01em}
.title .qo{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--rule);
  border-radius:6px;background:var(--paper);color:var(--dim);min-width:200px;
}
.title .qo:hover{border-color:var(--dim);color:var(--ink-2)}
kbd{font:500 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--paper);color:var(--ink-2)}
.menu-btn{display:none;width:28px;height:28px;align-items:center;justify-content:center;border-radius:5px}
.menu-btn:hover{background:var(--chrome-2)}

/* activity bar */
.act{grid-area:act;background:var(--chrome);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.act button{width:48px;height:44px;display:grid;place-items:center;color:var(--dim);position:relative}
.act button:hover{color:var(--ink)}
.act button[aria-pressed="true"]{color:var(--ink)}
.act button[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--blue)}
.act svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.act .spacer{flex:1}
.act .sun{display:none}
:root[data-theme="dark"] .act .sun{display:block}
:root[data-theme="dark"] .act .moon{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .act .sun{display:block}
  :root:not([data-theme="light"]) .act .moon{display:none}
}
.act a{width:48px;height:44px;display:grid;place-items:center;color:var(--dim)}
.act a:hover{color:var(--ink)}
.act a:hover .brand{color:var(--blue)}
.act svg.brand{width:19px;height:19px;fill:currentColor;stroke:none}
.act .sep{width:24px;height:1px;background:var(--rule);margin:4px 0}
.act button:last-child{margin-bottom:6px}

/* sidebar */
.side{grid-area:side;background:var(--chrome);border-right:1px solid var(--rule);overflow:auto;min-width:0;font:400 14px/1 var(--mono)}
.side h2{margin:0;padding:12px 16px 8px;font:500 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
.view[hidden]{display:none}
.tree{list-style:none;margin:0;padding:0 0 16px}
.tree ul{list-style:none;margin:0;padding:0}
.node{
  display:flex;align-items:center;gap:6px;width:calc(100% - 12px);height:30px;margin-inline:6px;border-radius:6px;
  padding-left:calc(4px + var(--d,0) * 14px);padding-right:10px;
  color:var(--ink-2);text-align:left;white-space:nowrap;position:relative;
}
.node:hover{background:var(--chrome-2);color:var(--ink)}
.node[aria-current="true"]{background:var(--sel);color:var(--ink)}
.node .tw{width:12px;color:var(--dim);transition:rotate .15s}
.node[aria-expanded="false"] .tw{rotate:-90deg}
li[data-collapsed] > ul{display:none}
.ic{font:600 11px/1 var(--mono);width:22px;text-align:center;letter-spacing:-.02em;flex:none}
.ic.ts,.ic.tsx{color:#3178C6}.ic.cpp{color:#3D6FD0}.ic.js{color:#B58A00}.ic.cs{color:#7E3FB8}.ic.md{color:#3E8DA8}
.ic.json{color:#B07A00}.ic.sh{color:#2F7D32}.ic.pdf{color:#C23B2A}.ic.html{color:#D35A1F}.ic.log{color:var(--dim)}
.ic.dir{color:var(--dim)}
.node .label{overflow:hidden;text-overflow:ellipsis}
.side .search{padding:0 12px 10px}
.side input[type=search]{width:100%;font:13px var(--mono);padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink)}
.results{list-style:none;margin:0;padding:0 0 16px}
.results button{display:block;width:100%;text-align:left;padding:6px 16px;line-height:1.45}
.results button:hover{background:var(--chrome-2)}
.results .f{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:12.5px}
.results .s{display:block;color:var(--ink-2);font:12px/1.5 var(--sans);margin:2px 0 0 28px}
.results mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{padding:6px 16px;color:var(--dim);font:12.5px/1.6 var(--sans)}
.gitlog{list-style:none;margin:0;padding:4px 0 16px}
.gitlog button{display:grid;grid-template-columns:18px 1fr;gap:0 8px;width:100%;text-align:left;padding:5px 14px;line-height:1.4}
.gitlog button:hover{background:var(--chrome-2)}
.gitlog .dot{grid-row:span 2;position:relative}
.gitlog .dot::before{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;border:2px solid var(--blue);background:var(--paper)}
.gitlog .dot::after{content:"";position:absolute;left:8px;top:15px;bottom:-20px;width:2px;background:var(--rule)}
.gitlog li:last-child .dot::after{display:none}
.gitlog .h{color:var(--num);font-size:12px}
.gitlog .m{color:var(--ink);font:13px/1.4 var(--sans)}
.gitlog .t{grid-column:2;color:var(--dim);font-size:11.5px}

/* main */
.main{grid-area:main;display:grid;grid-template-rows:36px 26px minmax(0,1fr) auto;min-width:0;min-height:0}
.tabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;height:36px;flex:none;
  border-right:1px solid var(--rule);font:13px/1 var(--mono);color:var(--dim);background:var(--chrome);position:relative;
}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--paper)}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--blue)}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--dim);font-size:15px;line-height:1}
.tab .x:hover{background:var(--chrome-2);color:var(--ink)}
.tabs .run{
  margin-left:auto;position:sticky;right:0;display:flex;align-items:center;gap:6px;padding:0 14px;
  font:500 12.5px/1 var(--mono);color:var(--str);background:var(--chrome);border-left:1px solid var(--rule)
}
.tabs .run:hover{background:var(--chrome-2)}
.tabs .run[hidden]{display:none}
.crumbs{display:flex;align-items:center;gap:6px;padding:0 16px;font:12px/1 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}
.crumbs b{font-weight:400;color:var(--ink-2)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 84px;min-height:0;position:relative}
.scroller{overflow:auto;scroll-behavior:smooth;min-height:0;scrollbar-width:thin;scrollbar-color:var(--mm) transparent}
@media (prefers-reduced-motion: reduce){.scroller{scroll-behavior:auto}}
.doc{counter-reset:ln;max-width:calc(780px + var(--gutter));padding:20px 40px 160px var(--gutter)}
.ln{counter-increment:ln;position:relative;border-radius:0 4px 4px 0}
.doc .ln{margin-left:calc(-1 * var(--gutter));padding-left:var(--gutter)}
.ln::before{
  content:counter(ln);position:absolute;left:0;width:44px;text-align:right;top:.32em;
  font:12px/1.4 var(--mono);color:var(--gut);user-select:none;
}
.ln:hover{background:transparent}
.ln:hover::before{color:var(--ink-2)}
.ln.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--mark)}to{background:transparent}}

.mono{font-family:var(--mono)}
.c{color:var(--cmt)}.k{color:var(--kw)}.s{color:var(--str)}.n{color:var(--num)}.f{color:var(--blue)}.t{color:var(--type)}.p{color:var(--ink-2)}
.num{color:var(--num);font-family:var(--mono);font-size:.93em;font-weight:500;letter-spacing:-.01em}

/* markdown-ish blocks */
.h1{font:500 clamp(30px,4cqi,44px)/1.2 var(--mono);letter-spacing:-.045em;margin:6px 0 10px;padding-top:4px}
.h1 .hash{color:var(--hash);font-weight:400;margin-right:.35em}
.h2{font:600 24px/1.35 var(--sans);letter-spacing:-.02em;margin:40px 0 16px;padding-top:2px}
.h3{font:600 19px/1.4 var(--sans);margin:30px 0 6px;padding-top:2px}
.h2 .hash,.h3 .hash{color:var(--hash);font-weight:400;margin-right:.45em}
.para{margin:0 0 18px;max-width:68ch;overflow-wrap:anywhere;color:var(--ink-2)}
.lede{font-size:18px;line-height:1.55;color:var(--ink);max-width:56ch;margin:0 0 18px}
.bullets{list-style:none;margin:0 0 6px;padding:0;max-width:68ch}
.bullets > li{padding-left:22px;margin:0 0 14px;color:var(--ink-2);position:relative}
.bullets > li::after{content:"-";position:absolute;top:0;left:var(--gutter);font-family:var(--mono);color:var(--gut)}
.doc .bullets > li.ln{padding-left:calc(var(--gutter) + 22px)}
.bullets > li.ln::after{left:calc(var(--gutter) + 4px)}
.code{
  font:13.5px/1.75 var(--mono);white-space:pre;overflow-x:auto;margin:8px 0 18px calc(-1 * var(--gutter));
  padding:2px 0;color:var(--ink);tab-size:2;scrollbar-width:thin;
}
.code .row{display:block;counter-increment:ln;position:relative;padding-left:var(--gutter);min-width:max-content}
.code .row::before{content:counter(ln);position:absolute;left:0;width:44px;text-align:right;font-size:12px;color:var(--gut)}
.code .row:hover{background:var(--line-hi)}
.code .row:hover::before{color:var(--ink-2)}

/* CodeLens links */
.lens{display:flex;flex-wrap:wrap;gap:4px 0;font:500 15px/1.6 var(--sans);color:var(--ink-2);margin:4px 0 24px}
.lens a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
.lens a:hover{color:var(--blue);text-decoration:underline}
.lens span[aria-hidden]{padding:0 6px;color:var(--hash)}
.lens a.primary{color:var(--str)}

/* letters: every glyph is addressable */
.split .wd{white-space:nowrap}
.doc[data-kind="academic-index"]{max-width:1120px;padding-bottom:48px}
.doc[data-kind="academic-index"] .h1{font-size:clamp(28px,4cqi,40px)}
.doc[data-kind="academic-index"] .para{margin-bottom:10px}
.doc[data-kind="academic-index"] .acad{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 18px;margin-top:20px}
.doc[data-kind="academic-index"] .acad img{aspect-ratio:16/9}
.doc[data-kind="academic-index"] .acad span{font:500 15px/1.4 var(--sans);margin-top:10px}
.doc[data-kind="skills"]{max-width:1120px;padding-bottom:64px}
.skill-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:24px 0;font-size:16px;line-height:1.6}
.skill-table caption{text-align:left;font-size:15px;color:var(--ink-2);padding-bottom:14px}
.skill-table th,.skill-table td{text-align:left;vertical-align:top;padding:16px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.skill-table thead th{font:500 13px/1.5 var(--mono);color:var(--dim);background:var(--chrome)}
.skill-table th:first-child{width:26%}
.skill-table tbody th{font-weight:600;color:var(--ink)}
.skill-table td{color:var(--ink-2)}
.skill-table ul{display:flex;flex-wrap:wrap;gap:6px 20px;list-style:none;margin:0;padding:0}
.skill-table li{max-width:100%}
.skill-table .skill-focus{color:var(--ink);font-weight:600}
@container (max-width:560px){
  .doc[data-kind="academic-index"] .acad{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skill-table th,.skill-table td{padding:12px 8px}
  .skill-table th:first-child{width:32%}
  .skill-table ul{gap:8px 14px}
}
@container (max-width:340px){
  .doc[data-kind="academic-index"] .acad{grid-template-columns:1fr}
  .skill-table,.skill-table tbody,.skill-table tr,.skill-table tbody th,.skill-table td{display:block;width:100%}
  .skill-table thead{display:none}
  .skill-table tbody th{width:100%;border-bottom:0;padding-bottom:0}
}
.h1,.h2,.h3{text-wrap:balance}
.contacts a{overflow-wrap:anywhere;min-width:0}
.para,.bullets,.entry p{text-wrap:pretty}
.doc .kv{row-gap:12px}
.doc .kv a{text-underline-offset:4px}
.doc .card .diff{max-width:100%}
.card .diff span{overflow-wrap:anywhere;min-width:0}
.palette input:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.split .ch{display:inline-block;transition:translate .18s cubic-bezier(.2,.8,.2,1),color .18s;white-space:pre}
.split .ch:hover{translate:none}
.split .ch.sel{background:var(--sel);color:var(--ink)}
.hero-name{position:relative;cursor:text}
.hero-name .ch{position:relative}
.hero-name .ch:hover::after{
  content:"";position:absolute;right:-1px;top:12%;bottom:8%;width:2px;background:var(--blue);
}
.caret{display:inline-block;width:.08em;height:.9em;background:var(--blue);vertical-align:-.05em;margin-left:.04em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: no-preference){
  .booted .hero-name .ch{animation:type .01s both;animation-delay:calc(var(--i) * 55ms + 120ms)}
  @keyframes type{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}

/* README */
.doc[data-kind="readme"]{max-width:calc(1280px + var(--gutter))}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:13px/1 var(--mono);margin:4px 0 6px}
.filters .c{margin-right:4px}
.filters .count{margin-left:6px}
.chip{font:12.5px/1 var(--mono);padding:6px 10px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2);background:var(--paper)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px;margin:10px 0 8px}
.card{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--paper);transition:border-color .15s,box-shadow .15s}
.card:hover,.card.hl{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.card[hidden]{display:none}
.card .shot{position:relative;display:block;width:100%;background:#000;cursor:ew-resize}
.card .shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.card .seg{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.card .shot:hover .seg,.card .shot:focus-visible .seg{opacity:1}
.card .seg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.card .seg i.on{background:#fff}
.card .body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .fn{display:flex;align-items:center;gap:4px;font:12px/1 var(--mono);color:var(--dim);text-align:left}
.card .fn:hover{color:var(--blue)}
.card .ttl{margin:0;font:600 21px/1.3 var(--sans);letter-spacing:-.01em}
.card .ttl button{text-align:left}
.card .ttl button:hover{color:var(--blue)}
.card .role{margin:0;font:14px/1.5 var(--sans);color:var(--dim)}
.card .did{margin:4px 0;font-size:16px;line-height:1.6;color:var(--ink-2)}
.card .diff{margin:6px 0 0;font:14px/1.65 var(--mono);white-space:pre-wrap;border:0;border-radius:6px;overflow:hidden;background:var(--chrome)}
.card .diff span{display:flex;gap:7px;padding:3px 10px 3px 9px;border-left:2px solid transparent;color:var(--ink-2)}
.card .diff span+span{border-top:0}
.card .diff i{font-style:normal;flex:none;width:7px;text-align:center}
.card .diff .del{border-left-color:var(--err)}
.card .diff .del i{color:var(--err)}
.card .diff .add{border-left-color:var(--str)}
.card .diff .add i{color:var(--str)}
.card .tags{margin:auto 0 0;padding-top:4px;font:13px/1.6 var(--sans);color:var(--dim)}
@media (prefers-reduced-motion: no-preference){
  ::view-transition-group(*){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
}
.timeline{margin:6px 0 10px;font:12px/1 var(--mono);max-width:1000px}
.tl-row{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:12px;width:100%;height:26px;text-align:left;border-radius:4px}
button.tl-row:hover,.tl-row.hl{background:var(--line-hi)}
.tl-name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
button.tl-row:hover .tl-name,.tl-row.hl .tl-name{color:var(--blue)}
.tl-track{position:relative;height:100%;border-left:1px solid var(--rule)}
.tl-bar{position:absolute;top:8px;height:10px;min-width:8px;border-radius:3px;background:var(--blue);opacity:.75}
button.tl-row:hover .tl-bar,.tl-row.hl .tl-bar{opacity:1}
.tl-axis{height:30px}
.tl-axis .tl-track > span:not(.tl-mil){position:absolute;top:2px;color:var(--dim);border-left:1px solid var(--rule);padding-left:4px;height:900%}
.tl-mil{position:absolute;top:0;height:calc(100% + 8 * 26px);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--dim) 14%,transparent) 6px 7px);border-radius:3px;pointer-events:auto}
.tl-mil b{position:absolute;bottom:12px;left:8px;font-weight:400;color:var(--dim);white-space:nowrap}
.timeline{position:relative;overflow:hidden}
.hello{max-width:900px}
.hello{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:28px;align-items:start}
.portrait{margin:6px 0 0}
.portrait img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block;filter:grayscale(.15)}
.portrait figcaption{font:11.5px/1.4 var(--mono);color:var(--dim);margin-top:6px}
.contacts{display:flex;flex-wrap:wrap;gap:10px 20px;font:15px/1.65 var(--sans);margin:4px 0 16px}
.contacts a{color:var(--blue);text-decoration:none}
.contacts a:hover{text-decoration:underline}
.recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:8px 0 6px}
.recent button{text-align:left;display:block}
.recent img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--rule);display:block;transition:translate .2s}
.recent button:hover img{translate:0 -3px}
.recent .fn{display:flex;gap:6px;align-items:center;font:500 13px/1 var(--mono);margin:10px 0 4px;color:var(--ink)}
.recent .d{font-size:14px;color:var(--ink-2);line-height:1.5}
.try{font:13px/1.9 var(--mono);color:var(--ink-2)}
.try code{color:var(--ink);background:var(--chrome);border:1px solid var(--rule);padding:1px 6px;border-radius:6px}
.try button.cmd{color:var(--ink);background:var(--chrome);border:1px solid var(--rule);padding:1px 6px;border-radius:6px;font:inherit}
.try button.cmd:hover{border-color:var(--blue);color:var(--blue)}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0 4px}
.gallery button{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--rule);background:var(--chrome)}
.gallery img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;transition:scale .3s}
.gallery button:hover img{scale:1.03}
.gallery.stage{grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:0;margin-bottom:8px;gap:8px}
.scroller{container-type:inline-size}
.doc[data-kind="project"], .doc[data-kind="academic"]{max-width:calc(1280px + var(--gutter))}
.top{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.top .gallery.stage{margin-bottom:0}
.top .info{display:none}
.top .info .code{margin:0;padding:10px 0;border:1px solid var(--rule);border-radius:10px;background:var(--chrome);font-size:14px;line-height:1.7}
.top .info .code{white-space:pre-wrap;overflow-x:visible}
.top .info .code .row{padding-left:40px;padding-right:16px;min-width:0;text-indent:-2ch;padding-inline-start:calc(40px + 2ch)}
.top .info .code .row::before{width:26px;font-size:11px}
.top + *{margin-top:18px}
@container (min-width: 1080px){
  .top{grid-template-columns:minmax(0,1fr) minmax(320px,440px)}
  .top .info{display:block;position:sticky;top:16px}
  .info-bottom{display:none}
}
.gallery.stage.lead > :first-child{grid-column:1 / -1}
.gallery.stage.lead > :first-child img{aspect-ratio:16/9}
.gallery.stage a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.gallery.stage a img{aspect-ratio:16/9}
.cap{font:14px/1.6 var(--sans);color:var(--dim);margin:4px 0 14px}

.fx{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--rule);background:#000;isolation:isolate;perspective:700px;touch-action:pan-y}
.fx .in{position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fx img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.fx.big img{aspect-ratio:16/9}
.fx .ov,.fx canvas,.fx img.post{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx .tag{position:absolute;left:8px;bottom:8px;z-index:3;font:11px/1 var(--mono);color:#fff;background:rgba(10,12,16,.72);padding:5px 7px;border-radius:6px;opacity:0;translate:0 4px;transition:opacity .18s,translate .18s;pointer-events:none;white-space:nowrap}
.fx.on .tag{opacity:1;translate:0 0}
/* meshes: orbit + wireframe pass */
.fx-mesh .in{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1))}
.fx-mesh.on .in{--s:1.06}
.fx-mesh .ov{opacity:0;transition:opacity .2s;mix-blend-mode:screen;background:
  repeating-linear-gradient(0deg,transparent 0 21px,rgba(160,220,255,.55) 21px 22px),
  repeating-linear-gradient(90deg,transparent 0 21px,rgba(160,220,255,.55) 21px 22px),
  repeating-linear-gradient(45deg,transparent 0 30px,rgba(160,220,255,.4) 30px 31px)}
.fx-mesh.on .ov{opacity:1}
/* shadow mapping: cursor is the light */
.fx-shadow .ov{opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--x,50%) var(--y,40%),rgba(255,244,214,.28) 0,transparent 16%,rgba(0,0,0,.72) 58%)}
.fx-shadow .ov::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,40%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#FFF6D8;box-shadow:0 0 0 4px rgba(255,246,216,.25),0 0 24px 8px rgba(255,236,170,.55)}
.fx-shadow.on .ov{opacity:1}
/* value noise: static crackle */
.fx-value canvas{opacity:0;image-rendering:pixelated;mix-blend-mode:overlay;transition:opacity .15s}
.fx-value.on canvas{opacity:.42}
.fx-value.on img{filter:contrast(1.15) saturate(.8);scale:1.04}
/* gradient noise: flowing warp (SVG turbulence) */
.fx-gradient.on img{filter:url(#fx-warp)}
/* post processing: split view, right side runs the pass */
.fx-post img.post{clip-path:inset(0 0 0 var(--x,50%));filter:url(#fx-chroma)}
.fx-post .ov{left:var(--x,50%);right:auto;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.fx-post .tag{opacity:1;translate:0 0}
.fx.big{cursor:crosshair}
.fx-post.big{cursor:ew-resize}
@media (prefers-reduced-motion: reduce){.fx .in{transition:none}}
.acad{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:10px 0}
.acad a{text-decoration:none;display:block}
.acad span{display:flex;gap:6px;align-items:center;font:13px/1 var(--mono);margin-top:8px}
.acad a:hover span{color:var(--blue)}

.kv{display:grid;grid-template-columns:max-content 1fr;gap:12px 20px;margin:8px 0 24px;font-size:17px;max-width:68ch}
.kv dt{font:500 15px/1.65 var(--sans);color:var(--dim)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}
.entry{margin:0 0 28px}
.entry .who{font-weight:500;color:var(--ink);font-size:18px}
.entry .when{font:14px/1.6 var(--sans);color:var(--dim)}
.entry p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}

.pdfview{width:100%;height:calc(100dvh - 380px);min-height:420px;border:1px solid var(--rule);border-radius:12px;margin:8px 0}

/* minimap */
.minimap{border-left:1px solid var(--rule);position:relative;overflow:hidden;cursor:pointer;background:var(--paper)}
.minimap .bars{position:absolute;inset:8px 10px auto 10px}
.minimap .bar{height:2px;margin-bottom:2px;background:var(--mm);border-radius:1px}
.minimap .bar.h{background:var(--mm-h);height:3px;margin-top:3px}
.minimap .bar.img{height:12px;background:var(--chrome-2)}
.minimap .bar.code{background:var(--mm-code)}
.minimap .vp{position:absolute;left:0;right:0;background:rgba(10,95,219,.07);border-top:1px solid rgba(10,95,219,.18);border-bottom:1px solid rgba(10,95,219,.18);pointer-events:none}

/* terminal panel */
.panel{border-top:1px solid var(--rule);height:var(--panel);display:grid;grid-template-rows:32px minmax(0,1fr);background:var(--paper);position:relative}
.panel.closed{height:32px}
.panel[hidden]{display:none}
.panel.closed .term{display:none}
.grip{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:ns-resize;z-index:2}
.grip:hover,.grip.drag{background:rgba(10,95,219,.25)}
.panel.closed .phead{cursor:pointer}
.phead{display:flex;align-items:center;gap:18px;padding:0 10px 0 16px;font:500 11px/1 var(--mono);color:var(--dim);letter-spacing:.05em}
.phead .on{color:var(--ink);box-shadow:inset 0 -1px var(--blue);padding:10px 0 9px}
.phead .tools{margin-left:auto;display:flex;gap:2px}
.phead .tools button{width:26px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--dim)}
.phead .tools button:hover{background:var(--chrome-2);color:var(--ink)}
.phead svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.term{overflow:auto;padding:4px 16px 12px;font:15px/1.65 var(--mono);color:var(--ink);cursor:text}
.term .out{white-space:pre-wrap;word-break:break-word}
.term .line{min-height:1.6em}
.prompt-row{display:flex;align-items:baseline;gap:0}
.ps{white-space:pre}
.ps .u{color:var(--str)}.ps .w{color:var(--blue)}
.term input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:0;caret-color:var(--blue)}
.term a{color:var(--blue)}
.term .err{color:var(--err)}
.term .ok{color:var(--str)}
.term .muted{color:var(--dim)}
.term .lsd{color:var(--blue);font-weight:500}
.term button.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hash);text-underline-offset:3px;font:inherit}
.term button.link:hover{color:var(--blue)}

/* status bar */
.status{
  grid-area:status;display:flex;align-items:center;gap:2px;background:var(--bar);color:#fff;
  font:12px/1 var(--mono);padding:0 6px;white-space:nowrap;overflow:hidden
}
.status > *{padding:0 8px;height:24px;display:flex;align-items:center;gap:6px}
.status button:hover,.status a:hover{background:rgba(255,255,255,.14)}
.status a{text-decoration:none}
.status .grow{flex:1}
.status .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#7CF29C}
.status svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

/* boot / compile overlay */
.boot{
  position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px;
  font:13.5px/1.75 var(--mono);color:var(--ink-2);
}
.boot .box{width:min(640px,100%)}
.boot .log{white-space:pre;overflow:hidden;min-height:18.5em}
.boot .log .pc{color:var(--dim)}
.boot .log .obj{color:var(--ink)}
.boot .bar{height:3px;background:var(--chrome-2);border-radius:2px;margin:16px 0 10px;overflow:hidden}
.boot .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .12s linear}
.boot .skip{font-size:12px;color:var(--dim)}
.boot.done{clip-path:inset(0 0 100% 0);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}
@media (prefers-reduced-motion: reduce){.boot.done{clip-path:none;opacity:0;transition:opacity .2s}}

/* dialogs */
dialog{border:1px solid var(--rule);border-radius:16px;overflow:hidden;padding:0;color:var(--ink);background:var(--paper);box-shadow:0 18px 50px -12px rgba(20,30,50,.28)}
dialog::backdrop{background:rgba(29,34,40,.18)}
.palette{width:min(600px,calc(100vw - 32px));margin-top:12vh}
.palette input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:14px 16px;font:14px var(--mono);outline:0;background:transparent;color:var(--ink)}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font:13px/1.2 var(--mono)}
.palette li button .pth{color:var(--dim);font-size:12px;margin-left:auto}
.palette li button[aria-selected="true"]{background:var(--sel)}
.lightbox{max-width:min(1200px,94vw);max-height:92vh;background:var(--paper)}
.lightbox img{display:block;max-width:100%;max-height:82vh;margin:auto}
.lightbox p{margin:0;padding:10px 14px;font:12.5px var(--mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:12px}
@media (prefers-reduced-motion: no-preference){
  dialog{transition:opacity .16s ease-out,translate .16s ease-out,display .16s allow-discrete,overlay .16s allow-discrete;opacity:0;translate:0 6px}
  dialog[open]{opacity:1;translate:0 0}
  @starting-style{dialog[open]{opacity:0;translate:0 6px}}
}

/* ───────── narrow screens ───────── */
@media (max-width: 860px){
  .tl-row{grid-template-columns:120px 1fr;gap:8px}
  .tl-mil b{display:none}
  :root{--gutter:44px;--panel:200px}
  .app,.app.no-side{grid-template-columns:0 0 minmax(0,1fr)}
  .act{visibility:hidden}
  .side{position:fixed;top:36px;bottom:24px;left:0;width:min(84vw,300px);z-index:20;box-shadow:12px 0 30px -12px rgba(20,30,50,.25);translate:-105% 0;transition:translate .22s ease-out;visibility:visible!important}
  .app.drawer .side{translate:0 0}
  .menu-btn{display:flex}
  .title .qo{min-width:0}
  .title .qo .lbl{display:none}
  .title .name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lights{display:none}
  .editor{grid-template-columns:minmax(0,1fr)}
  .minimap{display:none}
  .doc{padding:16px 16px 120px var(--gutter)}
  .ln::before{width:30px;font-size:11px}
  .code .row::before{width:30px;font-size:11px}
  .hello{grid-template-columns:1fr}
  .portrait{max-width:160px;order:-1}
  .recent{grid-template-columns:1fr}
  .status .hide-sm{display:none}
  .code{font-size:14px}
  .h1{font-size:clamp(28px,6vw,38px);line-height:1.2}
  .h2{font-size:23px}
  .doc{padding-right:20px}
  .contacts{gap:10px 16px}
  .kv{grid-template-columns:1fr;gap:4px}
  .kv dd{margin-bottom:12px}
  .chip{min-height:36px;font-size:14px}
  .node{height:36px}
  .term input{font-size:16px}
  .palette input,.side input[type=search]{font-size:16px}
  .card .body{padding:18px}
  .cards{gap:20px}
}
@media (max-width: 860px) and (prefers-reduced-motion: reduce){.side{transition:none}}

function openFile(f, {push=true, echo=false, focusLine=null} = {}){
  if (!f) return;

  $('#winTitle').textContent = `${f.name} — hyunwoo-yang`;
  document.title = f.kind==='readme' && f.path==='README.md' ? 'Hyunwoo Yang — portfolio' : `${f.name} — Hyunwoo Yang`;
  const run = f.data?.links?.[0];
  $('#runBtn').hidden = !(f.kind==='project' || f.kind==='academic');
  if (run) $('#runLabel').textContent = run.run || 'Run';
  if (f.kind==='academic') $('#runLabel').textContent = 'Live demo';
  if (push) history.replaceState(null,'','#/'+f.path);
  if (echo) termEcho(`code ${f.path}`);
  if (focusLine != null){
    const ln = doc.querySelectorAll('.ln')[focusLine];
    if (ln){ ln.scrollIntoView({block:'center'}); ln.classList.add('flash'); }
  }
  app.classList.remove('drawer'); $('#menuBtn').setAttribute('aria-expanded','false');
}

function renderTabs(){
  const tabs = $('#tabs'); const run = $('#runBtn');
  tabs.querySelectorAll('.tab').forEach(t=>t.remove());
  openTabs.forEach(f=>{
    const t = document.createElement('div');
    t.className='tab'; t.setAttribute('role','tab'); t.setAttribute('aria-selected', f===current);
    t.tabIndex = f===current ? 0 : -1;
    t.innerHTML = `${icon(f.ext)}<span>${esc(f.name)}</span><button class="x" aria-label="Close ${esc(f.name)}">×</button>`;
    t.addEventListener('click', e => { if (e.target.closest('.x')) closeTab(f); else openFile(f); });
    t.addEventListener('keydown', e => { if (e.key==='Enter') openFile(f); });
    tabs.insertBefore(t, run);
  });
  tabs.querySelector('[aria-selected="true"]')?.scrollIntoView({inline:'nearest',block:'nearest'});
}
function closeTab(f){
  const i = openTabs.indexOf(f); openTabs.splice(i,1);
  if (!openTabs.length) openTabs.push(byPath('README.md'));
  if (f===current) openFile(openTabs[Math.max(0,i-1)]); else renderTabs();
}

/* graphics demos: each render reacts like its technique */
const POST_PASSES = [
  ['chromatic_aberration','url(#fx-chroma)'],
  ['tonemap_bw','grayscale(1) contrast(1.45) brightness(1.05)'],
  ['bloom','brightness(1.2) saturate(1.7) contrast(1.1) blur(.6px)'],
  ['invert','invert(1) hue-rotate(180deg)'],
  ['sepia_grade','sepia(.85) contrast(1.15) saturate(1.3)']
];
const FX = {
  mesh:{
    move(el,x,y){ el.style.setProperty('--ry', ((x-.5)*26).toFixed(1)+'deg'); el.style.setProperty('--rx', ((.5-y)*18).toFixed(1)+'deg'); },
    leave(el){ el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
  },
  shadow:{
    move(el,x,y){ el.style.setProperty('--x',(x*100).toFixed(1)+'%'); el.style.setProperty('--y',(y*100).toFixed(1)+'%');
      el.querySelector('.tag').textContent = `light.pos = (${x.toFixed(2)}, ${(1-y).toFixed(2)})`; }
  },
  value:{
    enter(el){
      const c = el.querySelector('canvas'), img = el.querySelector('img'), tag = el.querySelector('.tag');
      const W=96, H=54, GX=13, GY=8; c.width=W; c.height=H;
      const ctx = c.getContext('2d'), data = ctx.createImageData(W,H);
      const sm = t => t*t*(3-2*t);
      let last = 0, seed = 0;
      const frame = () => {
        seed++;
        const L = Array.from({length:(GX+1)*(GY+1)}, ()=>Math.random());
        for (let y=0;y<H;y++) for (let x=0;x<W;x++){
          const fx = x/W*GX, fy = y/H*GY, ix = fx|0, iy = fy|0, tx = sm(fx-ix), ty = sm(fy-iy);
          const a = L[iy*(GX+1)+ix], b = L[iy*(GX+1)+ix+1], cc = L[(iy+1)*(GX+1)+ix], d = L[(iy+1)*(GX+1)+ix+1];
          const v = (a+(b-a)*tx) + ((cc+(d-cc)*tx) - (a+(b-a)*tx))*ty;          // lattice value noise
          const g = Math.max(0, Math.min(255, v*170 + 40 + (Math.random()-.5)*70)); // plus grain: the crackle
          const i = (y*W+x)*4; data.data[i]=data.data[i+1]=data.data[i+2]=g; data.data[i+3]=255;
        }
        const tear = Math.random() < .25 ? Math.random()*H|0 : -1;            // an occasional scanline tear
        if (tear >= 0) for (let y=tear;y<Math.min(H,tear+2);y++) for (let x=0;x<W;x++){ const i=(y*W+x)*4; data.data[i]=data.data[i+1]=data.data[i+2]=235; }
        ctx.putImageData(data,0,0);
        img.style.translate = Math.random() < .3 ? `${(Math.random()*6-3).toFixed(1)}px 0` : '0 0';
        tag.textContent = `value_noise(seed=${seed})`;
      };
      if (reduced.matches){ frame(); img.style.translate=''; return; }
      const loop = t => { if (t-last > 70){ last = t; frame(); } el._raf = requestAnimationFrame(loop); };
      el._raf = requestAnimationFrame(loop);
    },
    leave(el){ cancelAnimationFrame(el._raf); el.querySelector('img').style.translate=''; }
  },
  gradient:{
    enter(el){
      const turb = document.getElementById('fxTurb'), flow = document.getElementById('fxFlow'), disp = document.getElementById('fxDisp'), tag = el.querySelector('.tag');
      let t0 = performance.now();
      const loop = t => {
        const k = (t-t0)/1000, f = 0.005 + (el._fx||.5)*0.01;
        turb.setAttribute('baseFrequency', `${f.toFixed(4)} ${(f*1.4).toFixed(4)}`);
        flow.setAttribute('dx', (Math.sin(k*.7)*40).toFixed(1)); flow.setAttribute('dy', (k*28 % 400).toFixed(1));
        disp.setAttribute('scale', (9 + Math.sin(k*1.3)*4 + (el._fy||.5)*8).toFixed(1));
        tag.textContent = `gradient_noise(freq=${f.toFixed(3)})`;
        if (!reduced.matches) el._raf = requestAnimationFrame(loop);
      };
      el._raf = requestAnimationFrame(loop);
    },
    move(el,x,y){ el._fx = x; el._fy = y; },
    leave(el){ cancelAnimationFrame(el._raf); }
  },
  post:{
    move(el,x){ el.style.setProperty('--x',(x*100).toFixed(1)+'%'); },
    enter(el){
      if (el.classList.contains('big') || reduced.matches) return;
      el._iv = setInterval(()=>FX.post.next(el), 1100);                       // thumbnails cycle on their own
    },
    leave(el){ clearInterval(el._iv); el.style.removeProperty('--x'); },
    next(el){
      el._p = ((el._p||0) + 1) % POST_PASSES.length;
      const [name, f] = POST_PASSES[el._p];
      el.querySelector('img.post').style.filter = f;
      el.querySelector('.tag').textContent = 'pass: ' + name;
    }
  }
};

// resolve a path; files can be named with or without their extension
function resolve(arg, base=cwd){
  if (!arg || arg==='~') return ROOT;
  let node = arg.startsWith('/') || arg.startsWith('~') ? ROOT : base;
  for (const part of arg.replace(/^~\/?|^\//,'').split('/').filter(Boolean)){
    if (part==='.') continue;
    if (part==='..'){ node = node.parent || ROOT; continue; }
    if (node.type!=='dir') return null;
    const lc = part.toLowerCase();
    node = node.children.find(c=>c.name.toLowerCase()===lc) || node.children.find(c=>c.type==='file' && c.name.toLowerCase().replace(/\.[^.]+$/,'')===lc);
    if (!node) return null;
  }
  return node;
}
// a looser lookup for the "cd igy" case: search the whole tree for a matching project name

  ls [dir]         list files
  cd &lt;dir|project&gt; move around, e.g. cd projects/games, cd igy, cd ..
  open &lt;file&gt;      open a file in the editor (also: cat, code)

<span class="muted">Tab completes names. ↑ ↓ walk your history.</span>`); },
  ls(args){

function runCommand(raw, echo=true){
  const line = raw.trim();
  if (echo) termEcho(line);
  if (!line) return;
  hist.push(line); hi = hist.length;
  const [cmd, ...args] = line.split(/\s+/);
  const fn = COMMANDS[cmd.toLowerCase()];
  if (fn) fn(args); else print(`zsh: command not found: ${esc(cmd)}. Type <button class="link" data-term="help">help</button> to see what works.`,'err');
  if ($('#panel').hidden || $('#panel').classList.contains('closed')) togglePanel(true);
}
tin.addEventListener('keydown', e=>{
  if (e.key==='Enter'){ const v = tin.value; tin.value=''; runCommand(v); }
  else if (e.key==='ArrowUp'){ if (hi>0){ hi--; tin.value=hist[hi]; } e.preventDefault(); }
  else if (e.key==='ArrowDown'){ if (hi<hist.length-1){ hi++; tin.value=hist[hi]; } else { hi=hist.length; tin.value=''; } e.preventDefault(); }
  else if (e.key==='Tab'){
    e.preventDefault();
    const m = tin.value.match(/^(\S+\s+)(.*)$/); if (!m) return;
    const arg = m[2]; const slash = arg.lastIndexOf('/');
    const base = slash>=0 ? resolve(arg.slice(0,slash) || '/') : cwd; const frag = arg.slice(slash+1).toLowerCase();
    if (!base || base.type!=='dir') return;
    const hits = base.children.filter(c=>c.name.toLowerCase().startsWith(frag));
    if (hits.length===1) tin.value = m[1] + arg.slice(0,slash+1) + hits[0].name + (hits[0].type==='dir'?'/':'');
    else if (hits.length>1){ termEcho(tin.value); print(hits.map(h=>h.name+(h.type==='dir'?'/':'')).join('   '),'muted'); }
  }
  else if (e.key==='l' && e.ctrlKey){ e.preventDefault(); out.innerHTML=''; }
});
term.addEventListener('click', e=>{
  const b = e.target.closest('[data-term]'); if (b){ runCommand(b.dataset.term); return; }
  if (!e.target.closest('a') && !getSelection().toString()) tin.focus({preventScroll:true});
});
$('#clearBtn').addEventListener('click',()=>{ out.innerHTML=''; togglePanel(true); });
$('#closeTermBtn').addEventListener('click',()=>{ $('#panel').hidden=true; $('#termToggle').setAttribute('aria-expanded','false'); syncMinimap(); });

function togglePanel(force){
  const p = $('#panel'); const open = force ?? (p.hidden || p.classList.contains('closed'));
  p.hidden = false;
  $('#termToggle').setAttribute('aria-expanded', String(open));
  p.classList.toggle('closed', !open);
  $('#collapseBtn').setAttribute('aria-expanded', String(open));
  $('#collapseBtn').setAttribute('aria-label', open ? 'Collapse terminal' : 'Expand terminal');
  $('#collapseBtn').title = open ? 'Collapse terminal' : 'Expand terminal';
  $('#collapseBtn').innerHTML = open ? '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>' : '<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>';
  if (open) tin.focus({preventScroll:true});
  syncMinimap();
}
$('#collapseBtn').addEventListener('click',()=>togglePanel());
document.querySelector('.phead').addEventListener('click', e=>{ if (!e.target.closest('.tools') && $('#panel').classList.contains('closed')) togglePanel(true); });
$('#runBtn').addEventListener('click',()=>{ termEcho('run'); COMMANDS.run(); });
$('#termToggle').addEventListener('click',()=>togglePanel());

// drag to resize the panel
(()=>{ const g=$('#grip'); let y0,h0;
  g.addEventListener('pointerdown',e=>{ y0=e.clientY; h0=$('#panel').offsetHeight; g.setPointerCapture(e.pointerId); g.classList.add('drag'); });
  g.addEventListener('pointermove',e=>{ if(!g.classList.contains('drag'))return; const h=Math.min(innerHeight*.7, Math.max(90, h0+(y0-e.clientY))); document.documentElement.style.setProperty('--panel',h+'px'); togglePanel(true); syncMinimap(); });
  g.addEventListener('pointerup',()=>g.classList.remove('drag'));
})();

/* ═════════ theme ═════════ */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (darkMQ.matches ? 'dark' : 'light')) === 'dark';
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
}
$('#themeBtn').addEventListener('click', ()=> setTheme(isDark() ? 'light' : 'dark'));

/* ═════════ command palette ═════════ */
const pal = $('#palette'), palIn = $('#palIn'), palList = $('#palList'); let palItems = [], palSel = 0;
const PAL_CMDS = [
  {name:'> Toggle dark mode', act:()=>setTheme(isDark() ? 'light' : 'dark')},
  {name:'> Toggle terminal', act:()=>togglePanel()},
  {name:'> Toggle side bar', act:()=>app.classList.toggle('no-side')},
  {name:'> Open resume', act:()=>window.open(LINKS.resume,'_blank','noopener')},
  {name:'> Rebuild portfolio', act:()=>replayBuild()},
  {name:'> Email Hyunwoo', act:()=>location.href=LINKS.email}
];
function palRender(){
  const q = palIn.value.trim().toLowerCase();
  palItems = q.startsWith('>') ? PAL_CMDS.filter(c=>c.name.toLowerCase().includes(q.slice(1).trim()))
    : allFiles.filter(f=>(f.path + ' ' + (f.data?.title||'')).toLowerCase().includes(q)).map(f=>({file:f}));
  palSel = 0;
  palList.innerHTML = palItems.map((it,i)=> it.file
    ? `<li role="none"><button role="option" data-i="${i}" aria-selected="${i===0}">${icon(it.file.ext)}${esc(it.file.name)}<span class="pth">${esc(it.file.parent.path||'portfolio')}</span></button></li>`
    : `<li role="none"><button role="option" data-i="${i}" aria-selected="${i===0}">${esc(it.name)}</button></li>`).join('') || '<li class="empty">No matching files.</li>';
}
function palPick(i){ const it = palItems[i]; if (!it) return; pal.close(); it.file ? openFile(it.file,{echo:true}) : it.act(); }
function palOpen(){ palIn.value=''; palRender(); pal.showModal(); palIn.focus(); }
palIn.addEventListener('input', palRender);
palIn.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); palSel = (palSel + (e.key==='ArrowDown'?1:-1) + palItems.length) % Math.max(1,palItems.length);
    palList.querySelectorAll('[role=option]').forEach((b,i)=>{ b.setAttribute('aria-selected', i===palSel); if(i===palSel) b.scrollIntoView({block:'nearest'}); }); }
  if (e.key==='Enter'){ e.preventDefault(); palPick(palSel); }
});
palList.addEventListener('click', e=>{ const b=e.target.closest('[data-i]'); if (b) palPick(+b.dataset.i); });
pal.addEventListener('click', e=>{ if (e.target===pal) pal.close(); });
$('#qoBtn').addEventListener('click', palOpen);

addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase()==='p'){ e.preventDefault(); palOpen(); }
  else if (e.ctrlKey && e.key==='`'){ e.preventDefault(); togglePanel(); }
  else if (mod && e.key.toLowerCase()==='b'){ e.preventDefault(); app.classList.toggle('no-side'); }
});

/* ═════════ boot: compile the portfolio ═════════ */
const BUILD = [
  ['$ cmake --build ./portfolio --target hyunwoo','cmd'],
  ...allFiles.filter(f=>f.kind==='project').map(f=>[`Building ${f.ext==='cpp'?'CXX':f.ext==='cs'?'C#':f.ext==='html'?'HTML':'JS'} object projects/${f.parent.name}/${f.name}.o`]),
  ['Building CXX object projects/graphics (5 demos)'],
  ['Linking about.md skills.md contact.md leadership.md'],
  ['Linking hyunwoo']
];
function buildLines(){
  return BUILD.map((l,i)=>{
    if (l[1]==='cmd') return `<span class="obj">${esc(l[0])}</span>`;
    const pc = Math.round(i/(BUILD.length-1)*100);
    return `<span class="pc">[${String(pc).padStart(3,' ')}%]</span> ${esc(l[0])}`;
  });
}
function finishLine(ms){ return `<span class="obj">Build succeeded in ${(ms/1000).toFixed(2)}s.</span> <span class="pc">0 errors, 0 warnings.</span>`; }

function boot(){
  const el = $('#boot'), log = $('#bootLog'), bar = $('#bootBar');
  let skipped = false, timer;
  const lines = buildLines();
  const seen = storage?.getItem('built') === '1';
  const done = () => {
    if (skipped) return; skipped = true; clearTimeout(timer);
    storage?.setItem('built','1');
    document.body.classList.add('booted');
    el.classList.add('done');
    setTimeout(()=>el.remove(), 600);
    removeEventListener('keydown', skip, true); el.removeEventListener('pointerdown', skip);
  };
  const skip = e => { if (e.type==='keydown' && (e.metaKey||e.ctrlKey)) return; done(); };
  if (seen || reduced.matches){ el.remove(); document.body.classList.add('booted'); return; }
  addEventListener('keydown', skip, true); el.addEventListener('pointerdown', skip);
  const t0 = performance.now(); let i = 0;
  (function step(){
    if (skipped) return;
    if (i < lines.length){
      log.innerHTML += (i ? '\n' : '') + lines[i]; i++;
      bar.style.width = (i/lines.length*100) + '%';
      timer = setTimeout(step, i===1 ? 260 : 90 + Math.random()*70);
    } else {
      log.innerHTML += '\n' + finishLine(performance.now()-t0);
      timer = setTimeout(done, 520);
    }
  })();
}
function replayBuild(){
  if (reduced.matches){ print(buildLines().join('\n') + '\n' + finishLine(1)); return; }
  const lines = buildLines(); const t0 = performance.now(); let i=0;
  (function step(){
    if (i<lines.length){ print(lines[i++]); setTimeout(step, 70); }
    else print(finishLine(performance.now()-t0));
  })();
}

/* ═════════ start ═════════ */
buildTree(); setPS();
const start = byPath(decodeURIComponent(location.hash.replace(/^#\//,''))) || byPath('README.md');
if (start !== byPath('README.md')) openTabs.push(byPath('README.md'));
openFile(start, {push:false});
if (start.parent !== ROOT) cwd = start.parent, setPS();
print(`<span class="muted">Last login: ${new Date().toDateString()} on ttys000</span>`);
print(`Type <button class="link" data-term="help">help</button>, or try <button class="link" data-term="cd projects/games">cd projects/games</button>.`);
addEventListener('hashchange', ()=>{ const f = byPath(decodeURIComponent(location.hash.replace(/^#\//,''))); if (f && f!==current) openFile(f,{push:false}); });
togglePanel(false);   // terminal starts hidden; open it from the bar, the icon, or Ctrl+`
boot();
})();
</script>
